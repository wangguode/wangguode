<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 185" width="1200" height="185">
  <defs>
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="60%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <radialGradient id="glow-right" cx="84%" cy="50%" r="36%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.18" />
      <stop offset="65%" stop-color="#4F46E5" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#818CF8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid-dark" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <rect width="1200" height="185" rx="12" fill="url(#bg-dark)" />
  <rect width="1200" height="185" rx="12" fill="url(#grid-dark)" />
  <rect width="1200" height="185" rx="12" fill="url(#glow-right)" />
  <rect x="0.75" y="0.75" width="1198.5" height="183.5" rx="11.25" fill="none" stroke="#1E293B" stroke-width="1.5" />

  <!-- Right-Side Minimalist Architectural Motif (Vertically Centered at y=92) -->
  <g transform="translate(800, 14)" opacity="0.88">
    <circle cx="240" cy="78" r="56" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 6" />
    <circle cx="240" cy="78" r="36" fill="none" stroke="#0284C7" stroke-width="1" stroke-opacity="0.45" />

    <!-- Acoustic Waveform -->
    <g fill="#38BDF8" fill-opacity="0.5">
      <rect x="20" y="69" width="3" height="18" rx="1.5" />
      <rect x="30" y="59" width="3" height="38" rx="1.5" />
      <rect x="40" y="47" width="3" height="62" rx="1.5" fill-opacity="0.75" />
      <rect x="50" y="63" width="3" height="30" rx="1.5" />
      <rect x="60" y="53" width="3" height="50" rx="1.5" fill-opacity="0.7" />
      <rect x="70" y="41" width="3" height="74" rx="1.5" fill-opacity="0.9" />
      <rect x="80" y="57" width="3" height="42" rx="1.5" />
      <rect x="90" y="65" width="3" height="26" rx="1.5" />
      <rect x="100" y="51" width="3" height="54" rx="1.5" fill-opacity="0.65" />
      <rect x="110" y="70" width="3" height="16" rx="1.5" />
    </g>

    <line x1="126" y1="78" x2="184" y2="78" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="3 3" stroke-opacity="0.6" />

    <!-- State Loop Nodes -->
    <rect x="214" y="52" width="52" height="52" rx="8" fill="none" stroke="#475569" stroke-width="1.2" />
    <circle cx="214" cy="52" r="4" fill="#38BDF8" />
    <circle cx="266" cy="52" r="4" fill="#818CF8" />
    <circle cx="266" cy="104" r="4" fill="#38BDF8" />
    <circle cx="214" cy="104" r="4" fill="#10B981" />
    <circle cx="240" cy="78" r="5" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />
  </g>

  <!-- Left Content Area (Vertically Balanced) -->
  <g transform="translate(52, 48)">
    <text x="0" y="0" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" letter-spacing="2">VOICE AI · AGENT HARNESS · DETERMINISTIC SYSTEMS</text>
    <text x="0" y="42" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" letter-spacing="0.5">王果 <tspan fill="#64748B" font-weight="400" font-size="22">/ Wang Guo</tspan></text>
    <rect x="0" y="58" width="240" height="2" rx="1" fill="url(#accent-line)" />
    <text x="0" y="88" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="400">专注于全双工实时语音引擎、编码智能体控制面与确定性工程系统</text>
  </g>
</svg>
