      <text x="71" y="17" text-anchor="middle" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12">知乎 @王果ai (1.2w+)</text>

      <rect x="154" y="0" width="176" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.85" stroke="#CBD5E1" stroke-width="1" />
      <text x="242" y="17" text-anchor="middle" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12">《OpenClaw 深度解析》作者</text>

      <rect x="342" y="0" width="156" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.85" stroke="#CBD5E1" stroke-width="1" />
      <text x="420" y="17" text-anchor="middle" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12">可运行代码与产品驱动</text>
