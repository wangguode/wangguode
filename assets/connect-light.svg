    <rect x="122" y="24" width="26" height="26" rx="5" fill="none" stroke="#059669" stroke-width="2.5" />
    <rect x="129" y="31" width="12" height="12" rx="2" fill="#059669" />
    <rect x="24" y="122" width="26" height="26" rx="5" fill="none" stroke="#059669" stroke-width="2.5" />
    <rect x="31" y="129" width="12" height="12" rx="2" fill="#059669" />
    <text x="86" y="84" text-anchor="middle" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="700">微信交友二维码</text>
