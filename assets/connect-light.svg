<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 214" width="1200" height="214">
  <defs>
    <linearGradient id="fbg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#ECFDF5" />
    </linearGradient>
    <radialGradient id="fglow-light" cx="88%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.10" />
      <stop offset="65%" stop-color="#0284C7" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0" />
    </radialGradient>
    <pattern id="fgrid-light" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#CBD5E1" stroke-width="0.6" stroke-opacity="0.45" />
    </pattern>
  </defs>

  <rect width="1200" height="214" rx="16" fill="url(#fbg-light)" />
  <rect width="1200" height="214" rx="16" fill="url(#fgrid-light)" />
  <rect width="1200" height="214" rx="16" fill="url(#fglow-light)" />
  <rect x="0.75" y="0.75" width="1198.5" height="212.5" rx="15.25" fill="none" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Left Friend & Collaboration Copy -->
  <g transform="translate(52, 40)">
    <circle cx="4.5" cy="-4.5" r="3.8" fill="#059669" />
    <text x="17" y="0" fill="#059669" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" letter-spacing="1.8">CONNECT &amp; COLLABORATE · 欢迎交流与交个朋友</text>

    <text x="0" y="38" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700">一起聊聊 Voice Agent、Harness 工程、世界模型与独立出海</text>

    <text x="0" y="70" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5">常驻南京 · 无论是开源项目切磋、《OpenClaw》读者交流、8kHz 语音网关架构咨询，还是纯粹认识同路人，都很高兴认识你。</text>
    <text x="0" y="96" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5">添加好友时请随手备注 <tspan fill="#047857" font-weight="600">「GitHub + 你的方向/称呼」</tspan>（方便第一时间通过并防广告号打扰）</text>

    <g transform="translate(0, 116)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">
      <rect x="0" y="0" width="174" height="26" rx="13" fill="#E0F2FE" stroke="#7DD3FC" />
      <text x="87" y="17" text-anchor="middle" fill="#0369A1">知乎 @王果ai (1.2w+)</text>

      <rect x="184" y="0" width="218" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1" />
      <text x="293" y="17" text-anchor="middle" fill="#1E293B">hello@statementflow.win</text>

      <rect x="412" y="0" width="196" height="26" rx="13" fill="#D1FAE5" stroke="#6EE7B7" />
      <text x="510" y="17" text-anchor="middle" fill="#047857">WeChat · 扫码右侧名片 →</text>
    </g>
  </g>

  <!-- Right WeChat QR Slot (WECHAT_QR_SLOT_START) -->
