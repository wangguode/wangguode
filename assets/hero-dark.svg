<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 215" width="1200" height="215">
  <defs>
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="60%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <radialGradient id="glow-right" cx="83%" cy="50%" r="38%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.20" />
      <stop offset="62%" stop-color="#10B981" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.82" />
      <stop offset="85%" stop-color="#F43F5E" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid-dark" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.24" />
    </pattern>
  </defs>

  <rect width="1200" height="215" rx="14" fill="url(#bg-dark)" />
  <rect width="1200" height="215" rx="14" fill="url(#grid-dark)" />
  <rect width="1200" height="215" rx="14" fill="url(#glow-right)" />
  <rect x="0.75" y="0.75" width="1198.5" height="213.5" rx="13.25" fill="none" stroke="#1E293B" stroke-width="1.5" />

  <!-- Right-Side Minimalist 3-Stage Motif: Acoustic Wave -> Harness Loop -> 3D World Sphere -->
  <g transform="translate(806, 59)" opacity="0.92">
    <!-- 1. Acoustic Waveform -->
    <g fill="#38BDF8" fill-opacity="0.62">
      <rect x="0" y="38" width="3.5" height="20" rx="1.75" />
      <rect x="11" y="26" width="3.5" height="44" rx="1.75" />
      <rect x="22" y="13" width="3.5" height="70" rx="1.75" fill="#10B981" fill-opacity="0.9" />
      <rect x="33" y="31" width="3.5" height="34" rx="1.75" />
      <rect x="44" y="19" width="3.5" height="58" rx="1.75" fill-opacity="0.8" />
      <rect x="55" y="6" width="3.5" height="84" rx="1.75" fill="#F43F5E" fill-opacity="0.9" />
      <rect x="66" y="25" width="3.5" height="46" rx="1.75" />
      <rect x="77" y="34" width="3.5" height="28" rx="1.75" fill="#10B981" fill-opacity="0.8" />
      <rect x="88" y="39" width="3.5" height="18" rx="1.75" />
    </g>

    <line x1="106" y1="48" x2="136" y2="48" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="3 3" stroke-opacity="0.65" />

    <!-- 2. Harness State Loop -->
    <g transform="translate(144, 20)">
      <rect x="0" y="0" width="56" height="56" rx="10" fill="none" stroke="#475569" stroke-width="1.3" />
      <circle cx="0" cy="0" r="4" fill="#38BDF8" />
      <circle cx="56" cy="0" r="4.2" fill="#F43F5E" />
      <circle cx="56" cy="56" r="4" fill="#38BDF8" />
      <circle cx="0" cy="56" r="4.2" fill="#10B981" />
      <circle cx="28" cy="28" r="5" fill="#0F172A" stroke="#10B981" stroke-width="2" />
    </g>

    <line x1="210" y1="48" x2="240" y2="48" stroke="#10B981" stroke-width="1.2" stroke-dasharray="3 3" stroke-opacity="0.65" />

    <!-- 3. 3D World Sphere -->
    <g transform="translate(284, 48)">
      <circle cx="0" cy="0" r="36" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.62" />
      <ellipse cx="0" cy="0" rx="36" ry="13" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.38" />
      <ellipse cx="0" cy="0" rx="15" ry="36" fill="none" stroke="#818CF8" stroke-width="1" stroke-opacity="0.45" />
      <circle cx="25" cy="-25" r="3.8" fill="#10B981" />
    </g>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(54, 48)">
    <circle cx="4" cy="-4.5" r="3.5" fill="#10B981" />
    <text x="16" y="0" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" letter-spacing="1.8">VOICE AI · AGENT HARNESS · WORLD MODELS</text>
    <text x="0" y="48" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="38" font-weight="700" letter-spacing="0.5">王果 <tspan fill="#64748B" font-weight="400" font-size="25">/ Wang Guo</tspan></text>
    <rect x="0" y="66" width="260" height="2" rx="1" fill="url(#accent-line)" />
    <text x="0" y="98" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="500">专注于全双工实时语音网关、编码智能体控制面与世界模型工程推演</text>
    <text x="0" y="130" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="400">清华大学出版社《OpenClaw 深度解析》作者 · 知乎 @王果ai (1.2w+)</text>
  </g>
</svg>
