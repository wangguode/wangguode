<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 215" width="1200" height="215">
  <defs>
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
    <radialGradient id="glow-right-light" cx="83%" cy="50%" r="38%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.11" />
      <stop offset="62%" stop-color="#059669" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent-line-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.92" />
      <stop offset="50%" stop-color="#059669" stop-opacity="0.80" />
      <stop offset="85%" stop-color="#E11D48" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid-light" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#CBD5E1" stroke-width="0.6" stroke-opacity="0.44" />
    </pattern>
  </defs>

  <rect width="1200" height="215" rx="14" fill="url(#bg-light)" />
  <rect width="1200" height="215" rx="14" fill="url(#grid-light)" />
  <rect width="1200" height="215" rx="14" fill="url(#glow-right-light)" />
  <rect x="0.75" y="0.75" width="1198.5" height="213.5" rx="13.25" fill="none" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Right-Side Minimalist 3-Stage Motif: Acoustic Wave -> Harness Loop -> 3D World Sphere -->
  <g transform="translate(806, 59)" opacity="0.9">
    <!-- 1. Acoustic Waveform -->
    <g fill="#0284C7" fill-opacity="0.54">
      <rect x="0" y="38" width="3.5" height="20" rx="1.75" />
      <rect x="11" y="26" width="3.5" height="44" rx="1.75" />
      <rect x="22" y="13" width="3.5" height="70" rx="1.75" fill="#059669" fill-opacity="0.85" />
      <rect x="33" y="31" width="3.5" height="34" rx="1.75" />
      <rect x="44" y="19" width="3.5" height="58" rx="1.75" fill-opacity="0.74" />
      <rect x="55" y="6" width="3.5" height="84" rx="1.75" fill="#E11D48" fill-opacity="0.88" />
      <rect x="66" y="25" width="3.5" height="46" rx="1.75" />
      <rect x="77" y="34" width="3.5" height="28" rx="1.75" fill="#059669" fill-opacity="0.76" />
      <rect x="88" y="39" width="3.5" height="18" rx="1.75" />
    </g>

    <line x1="106" y1="48" x2="136" y2="48" stroke="#0284C7" stroke-width="1.2" stroke-dasharray="3 3" stroke-opacity="0.55" />

    <!-- 2. Harness State Loop -->
    <g transform="translate(144, 20)">
      <rect x="0" y="0" width="56" height="56" rx="10" fill="none" stroke="#94A3B8" stroke-width="1.3" />
      <circle cx="0" cy="0" r="4" fill="#0284C7" />
      <circle cx="56" cy="0" r="4.2" fill="#E11D48" />
      <circle cx="56" cy="56" r="4" fill="#0284C7" />
      <circle cx="0" cy="56" r="4.2" fill="#059669" />
      <circle cx="28" cy="28" r="5" fill="#FFFFFF" stroke="#059669" stroke-width="2" />
    </g>

    <line x1="210" y1="48" x2="240" y2="48" stroke="#059669" stroke-width="1.2" stroke-dasharray="3 3" stroke-opacity="0.55" />

    <!-- 3. 3D World Sphere -->
    <g transform="translate(284, 48)">
      <circle cx="0" cy="0" r="36" fill="none" stroke="#0284C7" stroke-width="1.2" stroke-opacity="0.55" />
      <ellipse cx="0" cy="0" rx="36" ry="13" fill="none" stroke="#0284C7" stroke-width="1" stroke-opacity="0.34" />
      <ellipse cx="0" cy="0" rx="15" ry="36" fill="none" stroke="#4F46E5" stroke-width="1" stroke-opacity="0.40" />
      <circle cx="25" cy="-25" r="3.8" fill="#059669" />
    </g>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(54, 46)">
    <circle cx="4" cy="-4.5" r="3.8" fill="#059669" />
    <text x="16" y="0" fill="#0284C7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" letter-spacing="1.8">WORLD MODELS · AGENT HARNESS · VOICE AI</text>
    <text x="0" y="50" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="42" font-weight="700" letter-spacing="0.5">王果 <tspan fill="#64748B" font-weight="400" font-size="26">/ Wang Guo</tspan></text>
    <rect x="0" y="69" width="280" height="2" rx="1" fill="url(#accent-line-light)" />
    <text x="0" y="102" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18.5" font-weight="500">专注于世界模型三维推演、编码智能体控制面与全双工实时语音网关</text>
    <text x="0" y="134" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="400">清华大学出版社《OpenClaw 深度解析》作者 · 知乎 @王果ai (1.2w+)</text>
  </g>
</svg>
