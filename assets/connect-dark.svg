    <g transform="translate(0, 116)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">
      <rect x="0" y="0" width="174" height="26" rx="13" fill="#0C4A6E" fill-opacity="0.4" stroke="#0284C7" stroke-opacity="0.55" />
      <text x="87" y="17" text-anchor="middle" fill="#7DD3FC">知乎 @王果ai (1.2w+)</text>

